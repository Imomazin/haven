name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# A push to a feature branch with an open PR would otherwise start two
# identical runs (push + pull_request) that race on the shared npm cache.
# Scope push to main so feature branches run exactly once via pull_request,
# and cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
        env:
          # Build does not connect to the database (all data pages are dynamic),
          # but Next reads env at build; a dummy keeps any eager checks happy.
          DATABASE_URL: "postgresql://user:pass@localhost:5432/haven?sslmode=disable"
